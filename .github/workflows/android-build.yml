name: Compilar Dark Kombat Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'DarkKombat.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Extrair ZIP do Projeto
        run: |
          if [ -f "DarkKombat.zip" ]; then
            echo "A descompactar DarkKombat.zip..."
            unzip -o DarkKombat.zip -d extracted_project
          else
            echo "Erro: DarkKombat.zip nao encontrado na raiz do repositorio!"
            exit 1
          fi

      - name: Testes automaticos (logica, IA, protocolo)
        run: |
          ROOT_PROJECT_DIR=$(find extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          cd "$ROOT_PROJECT_DIR"
          node tests/run.js

      - name: Compilar APK
        run: |
          ROOT_PROJECT_DIR=$(find extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          if [ -z "$ROOT_PROJECT_DIR" ]; then
            echo "Erro: Pasta raiz do projeto Gradle nao encontrada."
            exit 1
          fi

          cd "$ROOT_PROJECT_DIR"
          echo "Diretorio raiz do projeto: $(pwd)"

          echo "A compilar o APK (assembleDebug)..."
          gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkKombat-debug-apk
          path: extracted_project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
